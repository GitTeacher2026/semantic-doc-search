name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate runtime config
        env:
          DOCSHELF_GITHUB_TOKEN: ${{ secrets.DOCSHELF_GITHUB_TOKEN }}
          DOCSHELF_VAULT_PASSWORD: ${{ secrets.DOCSHELF_VAULT_PASSWORD }}
          DOCSHELF_MEGA_EMAIL: ${{ secrets.DOCSHELF_MEGA_EMAIL }}
          DOCSHELF_MEGA_PASSWORD: ${{ secrets.DOCSHELF_MEGA_PASSWORD }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const token = process.env.DOCSHELF_GITHUB_TOKEN || "";
          const vaultPassword = process.env.DOCSHELF_VAULT_PASSWORD || "docshelf2024";
          const megaEmail = process.env.DOCSHELF_MEGA_EMAIL || "reagon.gm@pm.me";
          const megaPassword = process.env.DOCSHELF_MEGA_PASSWORD || "pk94?S6.Jfz0";
          const web3formsKey = process.env.WEB3FORMS_ACCESS_KEY || "";
          const googleClientId = (process.env.GOOGLE_CLIENT_ID || "").trim();
          const oneDriveClientId = (process.env.ONEDRIVE_CLIENT_ID || "").trim();
          const githubOAuthClientId = (process.env.GITHUB_OAUTH_CLIENT_ID || "").trim();
          const [owner, repo] = String(process.env.GITHUB_REPOSITORY || "owner/repo").split("/");
          const siteUrl = `https://${owner.toLowerCase()}.github.io/${repo}/`;
          const config = `/** Generated during deploy — do not edit manually. */
          export const GITHUB_OWNER = ${JSON.stringify(owner)};
          export const GITHUB_REPO = ${JSON.stringify(repo)};
          export const GITHUB_BRANCH = "main";
          export const GITHUB_TOKEN = ${JSON.stringify(token)};
          export const STORE_PATH = "data/browser-store.enc.json";
          export const USERS_PATH = "data/users.json";
          export const ADMIN_EMAIL = "reagon.gm@pm.me";
          export const SITE_URL = ${JSON.stringify(siteUrl)};
          export const VAULT_PASSWORD = ${JSON.stringify(vaultPassword)};
          export const WEB3FORMS_ACCESS_KEY = ${JSON.stringify(web3formsKey)};
          export const GOOGLE_CLIENT_ID = ${JSON.stringify(googleClientId)};
          export const ONEDRIVE_CLIENT_ID = ${JSON.stringify(oneDriveClientId)};
          export const GITHUB_OAUTH_CLIENT_ID = ${JSON.stringify(githubOAuthClientId)};
          export const MEGA_EMAIL = ${JSON.stringify(megaEmail)};
          export const MEGA_PASSWORD = ${JSON.stringify(megaPassword)};
          `;
          fs.writeFileSync("docs/js/config.js", config);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
