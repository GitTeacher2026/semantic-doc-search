name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate runtime config
        env:
          DOCSHELF_GITHUB_TOKEN: ${{ secrets.DOCSHELF_GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const token = process.env.DOCSHELF_GITHUB_TOKEN || "";
          const config = `/** Generated during deploy — do not edit manually. */
          export const GITHUB_OWNER = "amany-moh-sy";
          export const GITHUB_REPO = "semantic-doc-search";
          export const GITHUB_BRANCH = "main";
          export const GITHUB_TOKEN = ${JSON.stringify(token)};
          export const STORE_PATH = "data/browser-store.enc.json";
          `;
          fs.writeFileSync("docs/js/config.js", config);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
