name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate runtime config
        env:
          DOCSHELF_GITHUB_TOKEN: ${{ secrets.DOCSHELF_GITHUB_TOKEN }}
          DOCSHELF_VAULT_PASSWORD: ${{ secrets.DOCSHELF_VAULT_PASSWORD }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const token = process.env.DOCSHELF_GITHUB_TOKEN || "";
          const vaultPassword = process.env.DOCSHELF_VAULT_PASSWORD || "docshelf2024";
          const web3formsKey = process.env.WEB3FORMS_ACCESS_KEY || "";
          const googleClientId = (process.env.GOOGLE_CLIENT_ID || "").trim();
          const config = `/** Generated during deploy — do not edit manually. */
          export const GITHUB_OWNER = "amany-moh-sy";
          export const GITHUB_REPO = "semantic-doc-search";
          export const GITHUB_BRANCH = "main";
          export const GITHUB_TOKEN = ${JSON.stringify(token)};
          export const STORE_PATH = "data/browser-store.enc.json";
          export const USERS_PATH = "data/users.json";
          export const ADMIN_EMAIL = "amanyak267@gmail.com";
          export const SITE_URL = "https://amany-moh-sy.github.io/semantic-doc-search/";
          export const VAULT_PASSWORD = ${JSON.stringify(vaultPassword)};
          export const WEB3FORMS_ACCESS_KEY = ${JSON.stringify(web3formsKey)};
          export const GOOGLE_CLIENT_ID = ${JSON.stringify(googleClientId)};
          `;
          fs.writeFileSync("docs/js/config.js", config);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
